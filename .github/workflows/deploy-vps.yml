name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.STAGING_APP_DIR }}"
            REPO="https://github.com/3mmar0/Mateen-Platform.git"
            mkdir -p "$(dirname "$APP_DIR")"
            if [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" /tmp/mateen.env.bak
            fi
            rm -rf /tmp/mateen-release
            git clone --depth 1 --branch main "$REPO" /tmp/mateen-release
            rsync -a --delete \
              --exclude 'backend/.env' \
              --exclude 'backend/storage/logs/' \
              --exclude 'backend/storage/framework/cache/' \
              --exclude 'backend/storage/framework/sessions/' \
              --exclude 'backend/storage/framework/views/' \
              --exclude 'backend/vendor/' \
              /tmp/mateen-release/ "$APP_DIR/"
            if [ -f /tmp/mateen.env.bak ]; then
              cp /tmp/mateen.env.bak "$APP_DIR/backend/.env"
            fi
            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            systemctl reload php8.4-fpm || systemctl reload php8.3-fpm || true
            curl -fsS -X POST "http://127.0.0.1/api/v1/auth/login" \
              -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -d '{"email":"admin@mateen.test","password":"password"}' >/dev/null
            echo "Staging deploy OK"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PRODUCTION_APP_DIR }}"
            REPO="https://github.com/3mmar0/Mateen-Platform.git"
            mkdir -p "$(dirname "$APP_DIR")"
            if [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" /tmp/mateen.env.bak
            fi
            rm -rf /tmp/mateen-release
            git clone --depth 1 --branch main "$REPO" /tmp/mateen-release
            rsync -a --delete \
              --exclude 'backend/.env' \
              --exclude 'backend/storage/logs/' \
              --exclude 'backend/storage/framework/cache/' \
              --exclude 'backend/storage/framework/sessions/' \
              --exclude 'backend/storage/framework/views/' \
              --exclude 'backend/vendor/' \
              /tmp/mateen-release/ "$APP_DIR/"
            if [ -f /tmp/mateen.env.bak ]; then
              cp /tmp/mateen.env.bak "$APP_DIR/backend/.env"
            fi
            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            systemctl reload php8.4-fpm || systemctl reload php8.3-fpm || true
            echo "Production deploy OK"
