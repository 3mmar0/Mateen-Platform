name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.STAGING_APP_DIR }}"
            REPO="https://github.com/3mmar0/Mateen-Platform.git"
            mkdir -p "$(dirname "$APP_DIR")"
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" /tmp/mateen.env.bak
            elif [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" /tmp/mateen.env.bak
            fi
            rm -rf /tmp/mateen-release
            git clone --depth 1 --branch main "$REPO" /tmp/mateen-release
            rsync -a --delete \
              --exclude '.env' \
              --exclude 'storage/logs/' \
              --exclude 'storage/framework/cache/' \
              --exclude 'storage/framework/sessions/' \
              --exclude 'storage/framework/views/' \
              --exclude 'vendor/' \
              --exclude '_obsolete/' \
              --exclude 'specs/' \
              /tmp/mateen-release/ "$APP_DIR/"
            if [ -f /tmp/mateen.env.bak ]; then
              cp /tmp/mateen.env.bak "$APP_DIR/.env"
            fi
            cd "$APP_DIR"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan db:seed --force || true
            php artisan config:clear
            php artisan route:clear
            for conf in /etc/nginx/sites-enabled/mateen.ammarelgndy.cloud.conf /etc/nginx/sites-available/mateen.ammarelgndy.cloud.conf; do
              if [ -f "$conf" ]; then
                sed -i 's|root /var/www/clients/mateen.ammarelgndy.cloud/public;|root '"$APP_DIR"'/public;|g' "$conf"
                sed -i 's|root /var/www/mateen/backend/public;|root '"$APP_DIR"'/public;|g' "$conf"
              fi
            done
            rm -rf /var/www/clients/mateen.ammarelgndy.cloud
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            nginx -t && systemctl reload nginx || true
            systemctl reload php8.4-fpm || systemctl reload php8.3-fpm || true
            curl -fsS -o /dev/null "http://127.0.0.1/"
            curl -fsS -o /dev/null "http://127.0.0.1/Mateen/html/home.html"
            curl -fsS -o /dev/null "http://127.0.0.1/Mateen/html/login.html"
            curl -fsS -o /dev/null "http://127.0.0.1/api/v1/subjects"
            echo "Staging deploy OK"

  deploy-production:
    if: github.event_name == 'push' || github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production (mateen.academy) via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PRODUCTION_APP_DIR }}"
            REPO="https://github.com/3mmar0/Mateen-Platform.git"
            mkdir -p "$(dirname "$APP_DIR")"
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" /tmp/mateen.env.bak
            elif [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" /tmp/mateen.env.bak
            fi
            rm -rf /tmp/mateen-release
            git clone --depth 1 --branch main "$REPO" /tmp/mateen-release
            rsync -a --delete \
              --exclude '.env' \
              --exclude 'storage/logs/' \
              --exclude 'storage/framework/cache/' \
              --exclude 'storage/framework/sessions/' \
              --exclude 'storage/framework/views/' \
              --exclude 'vendor/' \
              --exclude '_obsolete/' \
              --exclude 'specs/' \
              /tmp/mateen-release/ "$APP_DIR/"
            if [ -f /tmp/mateen.env.bak ]; then
              cp /tmp/mateen.env.bak "$APP_DIR/.env"
            else
              cp "$APP_DIR/.env.example" "$APP_DIR/.env"
              cd "$APP_DIR"
              php artisan key:generate --force
            fi
            cd "$APP_DIR"
            python3 "$APP_DIR/scripts/ci_apply_prod_env.py" "$APP_DIR"
            rm -f "$APP_DIR/public/index.html" /var/www/mateen.academy/index.html /var/www/mateen.academy/public/index.html
            rm -rf "$APP_DIR/public/Mateen/html" /var/www/mateen.academy/public/Mateen/html /var/www/mateen.academy/Mateen/html
            grep -RIl 'Mateen/html/home.html' /etc/apache2 2>/dev/null | while read -r f; do
              sed -i '/Redirect[[:space:]].*\/Mateen\/html\/home\.html/d' "$f"
              sed -i '/RedirectMatch[[:space:]].*home\.html/d' "$f"
              sed -i '/RewriteRule[[:space:]].*Mateen\/html\/home\.html/d' "$f"
            done || true
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            mkdir -p storage/framework/{sessions,views,cache/data} storage/logs storage/app/public bootstrap/cache
            php artisan migrate --force
            php artisan db:seed --force || true
            php artisan storage:link || true
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            # Point Apache docroot at Laravel public/ and drop old / → home.html redirects
            for conf in /etc/apache2/sites-available/mateen.academy.conf \
                        /etc/apache2/sites-available/mateen.academy-le-ssl.conf \
                        /etc/apache2/sites-enabled/mateen.academy.conf \
                        /etc/apache2/sites-enabled/mateen.academy-le-ssl.conf; do
              if [ -f "$conf" ]; then
                sed -i 's|DocumentRoot /var/www/mateen.academy$|DocumentRoot '"$APP_DIR"'/public|g' "$conf"
                sed -i 's|DocumentRoot /var/www/mateen.academy/public|DocumentRoot '"$APP_DIR"'/public|g' "$conf"
                sed -i 's|<Directory /var/www/mateen.academy>|<Directory '"$APP_DIR"'/public>|g' "$conf"
                sed -i 's|<Directory /var/www/mateen.academy/public>|<Directory '"$APP_DIR"'/public>|g' "$conf"
                sed -i '/Redirect[[:space:]].*\/Mateen\/html\/home\.html/d' "$conf"
                sed -i '/RedirectMatch[[:space:]].*home\.html/d' "$conf"
                sed -i '/RewriteRule[[:space:]].*Mateen\/html\/home\.html/d' "$conf"
                grep -q 'DirectoryIndex index.php' "$conf" || sed -i '/DocumentRoot/a\        DirectoryIndex index.php' "$conf"
              fi
            done
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            a2dismod php8.3 || true
            a2enmod rewrite php8.4 headers || true
            echo "==== apache docroot/redirect dump ===="
            grep -nR -E 'Redirect|RewriteRule|DocumentRoot|DirectoryIndex|home\.html' /etc/apache2 --include='*.conf' 2>/dev/null | head -200 || true
            find /var/www -maxdepth 4 -name '.htaccess' -exec grep -nH -E 'Redirect|RewriteRule|home\.html' {} + 2>/dev/null | head -80 || true
            apache2ctl configtest
            systemctl restart apache2
            curl -sI "https://mateen.academy/" | head -20
            curl -fsS "https://mateen.academy/" -o /tmp/mateen-home.html
            grep -q 'data-blade-home' /tmp/mateen-home.html
            curl -fsS "https://mateen.academy/login" -o /tmp/mateen-login.html
            grep -q 'تسجيل الدخول' /tmp/mateen-login.html
            curl -fsS "https://mateen.academy/about" -o /tmp/mateen-about.html
            grep -q 'التعريف بالبرنامج' /tmp/mateen-about.html
            code_login=$(curl -sI "https://mateen.academy/Mateen/html/login.html" | awk 'BEGIN{c=0} /^HTTP/{c=$2} END{print c}')
            test "$code_login" = "301"
            code_about=$(curl -sI "https://mateen.academy/Mateen/html/about.html" | awk 'BEGIN{c=0} /^HTTP/{c=$2} END{print c}')
            test "$code_about" = "301"
            curl -fsS -o /dev/null "https://mateen.academy/api/v1/subjects"
            echo "Production deploy OK — https://mateen.academy"
