openapi: 3.0.3
info:
  title: Mateen Laravel Backend API
  version: 1.0.0
  description: >
    JSON API for the Mateen scientific education platform. Replaces Firebase Auth/Firestore
    for the existing Arabic RTL PWA client. All domains required before production cutover.
servers:
  - url: https://api.example.com/api/v1
    description: Production (placeholder)
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: Auth
  - name: Users
  - name: Subjects
  - name: Materials
  - name: Students
  - name: Schedules
  - name: Assignments
  - name: Library
  - name: News
  - name: Messaging
  - name: Support
  - name: Stats
  - name: Notifications
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                phone: { type: string }
                role:
                  type: string
                  enum: [admin, support, supervisor, teacher, student, mateen]
                subject_id: { type: integer, nullable: true }
      responses:
        '201':
          description: Registered; returns token + user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                expected_role:
                  type: string
                  description: Optional client-selected role to match (current UI behavior)
                  enum: [admin, support, supervisor, teacher, student, mateen]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials (generic Arabic message)
        '403':
          description: Role mismatch with expected_role

  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke current token
      responses:
        '204': { description: Logged out }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted (always generic success to avoid enumeration) }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password updated }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    delete:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Permanently delete account (self or admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Hard-deleted }
        '403': { description: Forbidden }

  /subjects:
    get:
      tags: [Subjects]
      security: [{ bearerAuth: [] }]
      summary: List subjects (visibility by role)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subject'
    post:
      tags: [Subjects]
      security: [{ bearerAuth: [] }]
      summary: Create subject (admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWrite'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /subjects/{id}:
    get:
      tags: [Subjects]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
    patch:
      tags: [Subjects]
      security: [{ bearerAuth: [] }]
      summary: Update subject metadata (admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWrite'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }

  /subjects/{id}/enrollments:
    post:
      tags: [Subjects]
      security: [{ bearerAuth: [] }]
      summary: Enroll current student in subject
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201': { description: Enrolled }
        '403': { description: Mateen friends and non-students forbidden }

  /subjects/{subjectId}/materials:
    get:
      tags: [Materials]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Materials visible to caller
    post:
      tags: [Materials]
      security: [{ bearerAuth: [] }]
      summary: Add material (admin/supervisor/subject teacher)
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialWrite'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /materials/{id}:
    patch:
      tags: [Materials]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialWrite'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }
    delete:
      tags: [Materials]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }
        '403': { description: Forbidden }

  /students:
    get:
      tags: [Students]
      security: [{ bearerAuth: [] }]
      summary: List students (scoped by role)
      parameters:
        - name: subject_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      tags: [Students]
      security: [{ bearerAuth: [] }]
      summary: Create student (admin/supervisor)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWrite'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /students/bulk:
    post:
      tags: [Students]
      security: [{ bearerAuth: [] }]
      summary: Bulk create students
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [students]
              properties:
                students:
                  type: array
                  items:
                    $ref: '#/components/schemas/StudentWrite'
      responses:
        '200': { description: Batch result with per-row status }

  /students/{id}:
    patch:
      tags: [Students]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWrite'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }

  /students/export:
    post:
      tags: [Students]
      security: [{ bearerAuth: [] }]
      summary: Export students report (Word/etc.)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [docx, xlsx, pdf] }
                columns: { type: array, items: { type: string } }
                group_by: { type: string, nullable: true }
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /schedules:
    get:
      tags: [Schedules]
      security: [{ bearerAuth: [] }]
      summary: List schedule entries (includes hijri_display fields)
      responses:
        '200': { description: OK }
    post:
      tags: [Schedules]
      security: [{ bearerAuth: [] }]
      summary: Create schedule entry (admin/supervisor)
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /schedules/{id}:
    patch:
      tags: [Schedules]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Schedules]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }

  /assignments:
    get:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      summary: Create assignment (teacher of subject / admin)
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /assignments/{id}/submissions:
    get:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: List submissions }
    post:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      summary: Student submit assignment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201': { description: Submitted }

  /submissions/{id}:
    patch:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      summary: Grade or update submission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }

  /library:
    get:
      tags: [Library]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: section
          in: query
          schema:
            type: string
            enum: [mateen_library, enrichment, podcast, courses]
      responses:
        '200': { description: OK }
    post:
      tags: [Library]
      security: [{ bearerAuth: [] }]
      summary: Create library item (admin/supervisor)
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /library/{id}:
    patch:
      tags: [Library]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Library]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }

  /news:
    get:
      tags: [News]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Published (or all for admin) }
    post:
      tags: [News]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }

  /news/{id}:
    patch:
      tags: [News]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Updated }
    delete:
      tags: [News]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }

  /conversations:
    get:
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conversations for current user }
    post:
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      summary: Start or resolve conversation with allowed participant
      responses:
        '201': { description: Created }
        '403': { description: Recipient not allowed for role }

  /conversations/{id}/messages:
    get:
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Message list }
    post:
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      summary: Send message (text; media only for staff roles)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                media_url: { type: string, nullable: true }
                media_type: { type: string, nullable: true }
      responses:
        '201': { description: Sent; triggers notification job }
        '422': { description: Media not allowed for student/mateen }

  /media/sign-upload:
    post:
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      summary: Issue signed upload params for Cloudinary (staff roles)
      responses:
        '200': { description: Upload signature payload }
        '403': { description: Forbidden for student/mateen }

  /devices:
    post:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Register FCM device token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token: { type: string }
                platform: { type: string }
      responses:
        '201': { description: Registered }

  /support/users:
    get:
      tags: [Support]
      security: [{ bearerAuth: [] }]
      summary: List users for support/admin
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }

  /support/users/{id}/theme:
    patch:
      tags: [Support]
      security: [{ bearerAuth: [] }]
      summary: Assign theme/ornament to user
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme_id: { type: string }
                ornament_id: { type: string, nullable: true }
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }

  /stats/summary:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Attendance/grades summary
      parameters:
        - name: subject_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Metrics payload }
        '403': { description: Forbidden }

  /stats/export:
    post:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Export stats (xlsx/docx/pdf)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [xlsx, docx, pdf] }
                filters: { type: object }
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    ValidationError:
      description: Validation failed (Arabic messages preferred)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role:
          type: string
          enum: [admin, support, supervisor, teacher, student, mateen]
        subject_id: { type: integer, nullable: true }
        theme_id: { type: string, nullable: true }
        ornament_id: { type: string, nullable: true }
        must_reset_password: { type: boolean }

    Subject:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        description: { type: string, nullable: true }
        axes: { type: array, items: { type: string } }
        can_enroll: { type: boolean }
        materials_visible: { type: boolean }

    SubjectWrite:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        axes: { type: array, items: { type: string } }

    MaterialWrite:
      type: object
      required: [title, type]
      properties:
        title: { type: string }
        type: { type: string, enum: [pdf, video, article, link] }
        body: { type: string, nullable: true }
        url: { type: string, nullable: true }
        sort_order: { type: integer }

    StudentWrite:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        interview_status: { type: string, enum: [not_done, done] }
        status_class: { type: string }
        password: { type: string, description: Optional; temp password or invite flow }
